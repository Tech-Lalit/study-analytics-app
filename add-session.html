<!DOCTYPE html>
<html>
<head>
    <title>Add Session</title>
    <script>
        // Inline script runs BEFORE the page renders
        if (!localStorage.getItem("user")) {
            window.location.replace("index.html");
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>📘 Add Study Session</h1>

    <input type="text" id="subject" placeholder="Enter Subject (e.g. DBMS)">
<input type="number" id="hours" placeholder="Hours Studied (e.g. 2)">
    
    <select id="rating">
        <option value="">Productivity</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
    </select><br>

    <button onclick="saveSession()">Save</button>
    <button onclick="goBack()">Back</button>
    <button onclick="toggleDarkMode()">🌙 Toggle Mode</button>
</div>

<script src="app.js"></script>

<button class="theme-toggle-btn" onclick="toggleDarkMode()" title="Toggle Dark Mode">
    🌙
</button>

<script src="app.js"></script>
</body>
</body>
</html>
