<!DOCTYPE html>
<html>
<head>
    <title>Study Analytics - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 id="auth-title">Login</h1>
        
        <div id="error-msg" style="margin-bottom: 10px; font-size: 0.8rem; font-weight: bold;"></div>
    
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        
        <button onclick="handleAuth()" id="auth-btn">Login</button>
        <p onclick="toggleAuthMode()" id="toggle-text">Don't have an account? Register</p>
    </div>

<script src="app.js"></script>

<button class="theme-toggle-btn" onclick="toggleDarkMode()" title="Toggle Dark Mode">
    🌙
</button>

<script src="app.js"></script>
</body>
</body>
</html>
